name: docker-publish

# Build & push the api / mcp Docker images to Docker Hub.
#   - On version tags (v*):   zeroicey/serenique-{api,mcp}:[0.1.0, v0.1.0, latest]
#   - On pushes to main:      zeroicey/serenique-{api,mcp}:main
#   - Manual:                 workflow_dispatch (uses the selected ref)
#
# Requires GitHub Actions secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
# (a Docker Hub access token with Read & Write scope).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api] # MCP 已停更（见 .ai/decisions/2026-08-08-mcp-sunset.md），发布只构建 api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: zeroicey/serenique-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=main,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
