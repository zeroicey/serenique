services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the project root .env}
      BLOB_ROOT: /data/blobs
      BLOB_MAX_SIZE: ${BLOB_MAX_SIZE:-104857600}
      # Required for `blob link` (signed access links). Must be >= 32 chars.
      BLOB_SIGNING_SECRET: ${BLOB_SIGNING_SECRET:-}
      # 认证：生产 fail-closed（缺 AUTH_TOKEN 启动即拒）。
      AUTH_TOKEN: ${AUTH_TOKEN:?Set AUTH_TOKEN in the project root .env}
      SESSION_TTL: ${SESSION_TTL:-2592000}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      NODE_ENV: production
    volumes:
      - blob-data:/data/blobs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: services/mcp/Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      - api
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the project root .env}
      BLOB_ROOT: /data/blobs
      BLOB_MAX_SIZE: ${BLOB_MAX_SIZE:-104857600}
      # 认证：生产 fail-closed（缺 AUTH_TOKEN 启动即拒）。
      AUTH_TOKEN: ${AUTH_TOKEN:?Set AUTH_TOKEN in the project root .env}
      NODE_ENV: production
      MCP_TRANSPORT: streamable-http
      PORT: 3001
      # Internal reach (compose service hostname); the MCP uses the service
      # layer directly, so this only feeds guidance fallbacks.
      SERENIQUE_API_BASE_URL: http://api:3000
      # Host-reachable base URL for upload curl examples — the API port is
      # published on localhost:3000, so host-side agents can reach it there.
      SERENIQUE_PUBLIC_API_BASE_URL: ${SERENIQUE_PUBLIC_API_BASE_URL:-http://localhost:3000}
    volumes:
      - blob-data:/data/blobs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  blob-data:
