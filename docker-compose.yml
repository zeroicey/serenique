services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BLOB_ROOT=/data/blobs
      - BLOB_MAX_SIZE=104857600
      - NODE_ENV=production
    volumes:
      - blob-data:/data/blobs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: services/mcp/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BLOB_ROOT=/data/blobs
      - BLOB_MAX_SIZE=104857600
      - NODE_ENV=production
      - MCP_TRANSPORT=sse
      - PORT=3001
      - SERENIQUE_API_BASE_URL=http://localhost:3000
    volumes:
      - blob-data:/data/blobs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  blob-data:
