# Test-only PostgreSQL for RUN_DB_TESTS integration tests.
# Usage: see services/api/package.json "test:integration:full".
# Credentials/port match the default TEST_DATABASE_URL in src/test/helpers.ts.
# If a development PostgreSQL is already on 5432, skip `up`/`down` and point
# TEST_DATABASE_URL at it instead.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: serenique
      POSTGRES_PASSWORD: serenique
      POSTGRES_DB: serenique
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serenique -d serenique"]
      interval: 1s
      timeout: 3s
      retries: 20
